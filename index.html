<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>とうじょう縁側｜地域のイベント情報サイト</title>
<meta name="description" content="農業・体験・グルメ・カルチャーまで。加東市のイベント情報を東条地域からお届けします！">
<!-- とうじょうRMOと共通のフォント（Noto Sans JP / Inter） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ==================== HEADER ====================
       ロゴ＋検索バーのみのミニマムな構成（メニューは持たない）
       ================================================================ -->
  <header class="site-header" id="hdr">
    <div class="wrap nav">
      <a href="./" class="logo">
        <span class="logo-text">
          <!-- siteName / siteNameSub は config.js（SITE_CONFIG）から反映されます -->
          <span id="siteName"></span>
          <small id="siteNameSub"></small>
        </span>
      </a>
      <form class="search-form" id="searchForm" role="search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <!-- placeholder / aria-label は config.js（searchPlaceholder / searchClearLabel）から反映されます -->
        <input type="text" id="searchInput" class="search-input" autocomplete="off" inputmode="search">
        <button type="button" id="searchClear" class="search-clear" hidden>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </form>
    </div>
  </header>

  <!-- ==================== CATEGORY FILTER ====================
       ヘッダー直下の帯として配置（参照サイトのフィルター行に準拠）
       ================================================================ -->
  <section class="filter-band">
    <div class="wrap">
      <nav class="category-filter" aria-label="カテゴリで絞り込み">
        <div id="categoryFilter"><!-- JSで生成 --></div>
      </nav>
    </div>
  </section>

  <!-- ==================== EVENT LIST ==================== -->
  <section class="section list-section" id="eventList">
    <div class="wrap">
      <div class="list-head reveal">
        <span class="eyebrow">Event Search</span>
        <!-- catchCopy / leadText は config.js から反映されます -->
        <h1 class="sec-title" id="catchCopy"></h1>
        <p class="lead" id="leadText"></p>
        <p class="result-count" id="resultCount" aria-live="polite"></p>
      </div>

      <div id="statusMessage" class="status-message" hidden></div>

      <div class="event-grid" id="eventGrid">
        <!-- JSで生成（カードをクリックすると詳細モーダルを表示） -->
      </div>

      <div class="load-more-wrap" id="loadMoreWrap" hidden>
        <button type="button" id="loadMoreBtn" class="btn load-more-btn"></button>
      </div>
    </div>
  </section>

  <!-- ==================== FOOTER ====================
       中身（.wrap 以下）は config.js の footerHtml から反映されます
       ================================================================ -->
  <footer id="siteFooter"></footer>

  <!-- ==================== EVENT DETAIL MODAL ====================
       ・イベントカードをクリックすると表示される詳細ビュー
       ・#modalDetail の中身は events.json の "detail" 列をそのまま
         HTMLとして描画します（意図的にエスケープしていません）
       ================================================================ -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalBox">
      <button type="button" class="modal-close" id="modalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal-scroll">
        <div class="modal-thumb" id="modalThumb"></div>
        <div class="modal-body">
          <span class="modal-category" id="modalCategory"></span>
          <h2 class="modal-title" id="modalTitle"></h2>
          <p class="modal-address" id="modalAddress"></p>
          <div class="modal-detail" id="modalDetail"></div>
          <a href="#" class="btn modal-link" id="modalLink" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
